<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrigé — Colle express</title>
<meta name="description" content="Exercice et corrigé détaillé — Colle express, prépa MP.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%2313213f'/%3E%3Ctext x='24' y='33' text-anchor='middle' font-family='Georgia' font-size='26' fill='white'%3E%E2%88%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/mathjax-config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js"></script>
<style>
/* Page de correction partageable : une feuille claire, imprimable et exportable en PDF */
:root{color-scheme:light}
body{background-color:#eef2f8}
.bar{position:sticky;top:0;z-index:5;background:#ffffffee;backdrop-filter:blur(6px);border-bottom:1px solid #d6deec}
.bar .in{max-width:860px;margin:auto;display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.bar .home{margin-right:auto;display:flex;gap:8px;align-items:center;text-decoration:none;color:#13213f;font-weight:700}
.bar .home .crest{width:34px;height:34px}
.sheet{--ink:#13213f;--soft:#5b6782;--line:#d6deec;--card:#fff;--wash:#f2f6fc;--chip:#ecf1f9;--red:#c4212b;--blue:#2851c2;--green:#1d7a4b;--amber:#a86200;--bg:#fff;
  color:#13213f;max-width:820px;margin:18px auto 40px;background:#fff;border:1px solid #d6deec;border-radius:16px;padding:34px 40px 30px 56px;position:relative;box-shadow:0 10px 30px -18px #0b163055;
  background-image:linear-gradient(#edf2fa 1px,transparent 1px),linear-gradient(90deg,#edf2fa 1px,transparent 1px);background-size:22px 22px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:#e3888d}
.sh-head{display:flex;gap:12px;align-items:center;border-bottom:2px solid #13213f;padding-bottom:12px;margin-bottom:18px}
.sh-head .crest{width:44px;height:44px}
.sh-head .t{flex:1;min-width:0}.sh-head small{white-space:nowrap}.sh-head b{font-family:Fraunces,serif;font-size:22px;display:block}.sh-head small{color:#5b6782}
.sh-head .lvl{text-align:right;font-size:13px;color:#5b6782}
.sheet h1{font-size:32px;margin:4px 0 14px;color:#13213f}
.openall{text-align:center;margin:10px 0}.sheet .co{margin:16px 0}
.sheet h2.part{font-family:Caveat,cursive;font-size:30px;color:#c4212b;margin:26px 0 8px;font-weight:700}
.sheet .fig{position:static;max-width:440px;margin:14px auto}
/* (ancienne liste d'indices) */.hints{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.hints li{display:grid;grid-template-columns:auto 1fr;gap:10px;border:1px solid #f0c9cb;background:#fdf5f5;border-radius:10px;padding:8px 12px}
.hints .n{font-family:Caveat,cursive;font-size:22px;color:#c4212b;font-weight:700;line-height:1.1}
.hints p{margin:.1em 0}
.sh-foot{margin-top:28px;border-top:1px solid #d6deec;padding-top:10px;font-size:12.5px;color:#5b6782;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.step,.qs>li,.fig,.result,.hints li,.donnees{break-inside:avoid;page-break-inside:avoid}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#13213f;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
.toast:empty{display:none}
@media(max-width:700px){.sheet{margin:0;border-radius:0;border:0;padding:20px 16px 20px 34px}.sheet::before{left:18px}.sheet h1{font-size:26px}.bar .lbl{display:none}.sh-head .lvl{display:none}}
@media print{.bar,.toast,.noprint,.chev{display:none}details.acc>summary small{display:none}.co{break-inside:auto}.sheet{background-image:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}.sheet{box-shadow:none;border:0;margin:0;max-width:none;padding:0 0 0 28px}.sheet::before{left:8px}@page{margin:14mm}}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <a class="home" href="./"><svg class="crest" viewBox="0 0 48 48" aria-hidden="true"><circle class="ring" cx="24" cy="24" r="23"/><circle class="in" cx="24" cy="24" r="19.5"/><text x="24" y="33" text-anchor="middle">∮</text></svg><span data-site></span></a>
  <button class="btn primary" id="bPdf"></button>
  <button class="btn" id="bShare"></button>
</div></div>
<article class="sheet" id="sheet"><p>Chargement…</p></article>
<div class="toast" id="toast"></div>
<script type="module" src="js/correction.js"></script>
</body>
</html>
