<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrigé — Colle express</title>
<meta name="description" content="Exercice et corrigé détaillé — Colle express, prépa MP.">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script src="js/mathjax-config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js"></script>
<style>
/* Page de correction partageable : une feuille claire, imprimable et exportable en PDF */
:root{color-scheme:light}
body{background-color:#F1EFE9}
.bar{position:sticky;top:0;z-index:5;background:#ffffffee;backdrop-filter:blur(6px);border-bottom:1px solid #DEDBD2}
.bar .in{max-width:860px;margin:auto;display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.bar .home{margin-right:auto;display:flex;gap:8px;align-items:center;text-decoration:none;color:#202522;font-weight:700}
.bar .home .crest{width:auto;height:32px;background:#fff;border-radius:9px;padding:2px 4px}
.sheet{--ink:#202522;--soft:#5C635E;--line:#DEDBD2;--card:#fff;--wash:#F1EFE9;--chip:#E9E7E0;--red:#B3261E;--blue:#235347;--green:#2F6B3A;--amber:#8A5A00;--bg:#fff;
  color:#202522;max-width:820px;margin:18px auto 40px;background:#fff;border:1px solid #DEDBD2;border-radius:16px;padding:34px 40px 30px 56px;position:relative;box-shadow:0 10px 30px -18px #20252233}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:linear-gradient(#235347,#D97952)}
.sh-head{display:flex;gap:12px;align-items:center;border-bottom:2px solid #235347;padding-bottom:12px;margin-bottom:18px}
.sh-head .crest{width:auto;height:44px}
.sh-head .t{flex:1;min-width:0}.sh-head small{white-space:nowrap}.sh-head b{font-family:var(--fd);font-weight:800;letter-spacing:-.02em;font-size:21px;display:block;white-space:nowrap}.sh-head small{color:#5C635E}
.sh-head .lvl{text-align:right;font-size:13px;color:#5C635E}
.sheet h1{font-size:32px;margin:4px 0 14px;color:#202522}
.openall{text-align:center;margin:10px 0}.sheet .co{margin:16px 0}
.sheet h2.part{font-family:var(--fd);font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:#235347;margin:28px 0 10px;font-weight:800}
.sheet .fig{position:static;max-width:440px;margin:14px auto}
/* (ancienne liste d'indices) */.hints{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.hints li{display:grid;grid-template-columns:auto 1fr;gap:10px;border:1px solid #f0c9cb;background:#fdf5f5;border-radius:10px;padding:8px 12px}
.hints .n{font-family:var(--fd);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#8A5A00;font-weight:800;line-height:1.3}
.hints p{margin:.1em 0}
.sh-foot{margin-top:28px;border-top:1px solid #DEDBD2;padding-top:10px;font-size:12.5px;color:#5C635E;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.step,.qs>li,.fig,.result,.hints li,.donnees{break-inside:avoid;page-break-inside:avoid}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#202522;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;opacity:1;display:block}.toast::before{display:none}
.toast:empty{display:none}
@media(max-width:700px){.sheet{margin:0;border-radius:0;border:0;padding:20px 16px 20px 34px}.sheet::before{left:18px}.sheet h1{font-size:26px}.bar .lbl{display:none}.sh-head .lvl{display:none}}
/* ---------- PDF / impression : une vraie feuille de corrigé, aérée et sans cadres superflus ---------- */
@media print{
  @page{size:A4;margin:15mm 14mm 17mm 14mm;
    @bottom-left{content:"Colle express · corrigé détaillé";font:8.5pt Manrope,sans-serif;color:#5C635E}
    @bottom-right{content:counter(page) " / " counter(pages);font:8.5pt Manrope,sans-serif;color:#5C635E}}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff!important}
  .bar,.toast,.noprint,.chev,.co-e,.sh-foot,details.acc>summary small{display:none!important}
  .sheet{max-width:none;margin:0;padding:0;border:0;border-radius:0;box-shadow:none;background:none;font-size:10.5pt;line-height:1.5}
  .sheet::before{display:none}
  .sh-head{border-bottom:1.6pt solid #235347;padding-bottom:7pt;margin-bottom:12pt}
  .sh-head .crest{height:34px}.sh-head b{font-size:16pt}
  .sheet h1{font-size:21pt;line-height:1.15;margin:0 0 12pt;letter-spacing:-.02em}
  .sheet .co{border:0!important;border-radius:0!important;background:none!important;box-shadow:none!important;padding:0!important;margin:0 0 14pt!important;break-inside:auto!important}
  .sheet .co::before,.sheet .co::after{display:none!important}
  .sheet .co-h{display:flex;align-items:baseline;gap:8pt;font-size:10pt;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#235347;
    border-bottom:.8pt solid #DEDBD2;padding:0 0 3pt;margin:0 0 7pt;break-after:avoid}
  .sheet .co-meta{margin-left:auto;font-size:8.5pt;font-weight:600;letter-spacing:0;text-transform:none;color:#5C635E}
  .enonce{font-size:11pt}
  .sheet .fig{max-width:320px;margin:8pt auto;break-inside:avoid}
  /* indices : deux lignes sobres */
  .sheet details.acc{border:0!important;background:none!important;box-shadow:none!important;margin:0 0 6pt!important;padding:0!important}
  .sheet details.hint-acc{break-inside:avoid}
  .sheet,.sheet>*:last-child{margin-bottom:0!important;padding-bottom:0!important}
  .sheet details.hint-acc>summary{display:flex;gap:6pt;align-items:center;padding:0!important;min-height:0;font-size:9.5pt;cursor:default}
  .sheet details.hint-acc>summary .hn{width:15pt;height:15pt;font-size:8pt}
  .sheet details.hint-acc .acc-body{padding:2pt 0 0 21pt!important;font-size:10pt;color:#334}
  /* correction : le titre devient un intitulé de section */
  .sheet details.corr-acc>summary{display:block;padding:0!important;margin:0 0 8pt;font-size:10pt;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#2F6B3A;border-bottom:.8pt solid #DEDBD2;padding-bottom:3pt!important}
  .sheet details.corr-acc>summary .acc-t b{font:inherit;color:inherit}
  .sheet .acc-body{padding:0!important;border:0!important}
  .result{break-inside:avoid;border:1pt solid #9fcfb5!important;background:#f1f9f4!important;border-radius:8pt;padding:7pt 10pt!important;margin:0 0 10pt}
  .corrige{font-size:10.5pt;line-height:1.5}
  .corrige .step,.step{break-inside:auto!important;page-break-inside:auto!important}
  .corrige .step h4,.corrige h5.sub{break-after:avoid;page-break-after:avoid}
  .corrige .step.etape{margin:13pt 0 0;padding-left:30pt}
  .corrige .step.etape::before{top:28px}
  .corrige .step.etape h4{font-size:12pt;min-height:24px;margin-bottom:5pt}
  .corrige .step.etape h4 .en{width:22px;height:22px;font-size:10.5pt;box-shadow:none}
  .corrige .e6{break-inside:avoid;padding:9pt 10pt 9pt 40pt!important;border:1pt solid #b9dcc8}
  .corrige .e6 h4 .en{left:9pt;top:9pt}
  .callout{break-inside:avoid;padding:6pt 9pt;margin:6pt 0;border-radius:7pt}
  .callout-t{font-size:8.5pt}
  .co-bilan{break-inside:avoid-page}
  mjx-container[display=true]{break-inside:avoid;margin:5pt 0!important}
  p,li{orphans:3;widows:3}
}
@media screen{.bar{display:block!important}}.bar .home{font-weight:600}
.wmk{font-family:var(--fd);font-weight:600;font-size:20px;letter-spacing:-.02em;color:#202522}.wmk i{font-weight:400;color:#A84A26}
.sheet::before{background:#D97952!important;width:1.5px!important;opacity:.7}
.sh-head .crest{display:none}
.shlogo{display:block;height:44px;width:auto;margin-bottom:4px}@media print{.shlogo{height:34px}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D1D1F">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colle express">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div class="bar"><div class="in">
  <a class="home" href="./"><img src="img/logo.png" alt="Colle express" width="175" height="32" style="height:32px;width:auto"></a>
  <button class="btn primary" id="bPdf"></button>
  <button class="btn" id="bShare"></button>
</div></div>
<article class="sheet" id="sheet"><p>Chargement…</p></article>
<div class="toast" id="toast"></div>
<script type="module" src="js/correction.js"></script>
</body>
</html>
