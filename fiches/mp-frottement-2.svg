<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="Solide posé sur un plan incliné d’angle α : il reste immobile si tan α ≤ f (la réaction équilibre le poids) ; il glisse si tan α > f, la réaction étant alors sur le bord du cône" class="fig-svg"><style>
