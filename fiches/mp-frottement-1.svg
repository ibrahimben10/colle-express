<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img" aria-label="Lois de Coulomb : la réaction R = N + T reste dans le cône de frottement d’angle φ (tan φ = f) tant qu’il n’y a pas de glissement ; elle est sur le bord du cône en cas de glissement" class="fig-svg"><style>
