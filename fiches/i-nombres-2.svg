  <rect x="20" y="50" width="24" height="40" rx="0" class="s fillR"/><rect x="44" y="50" width="110" height="40" rx="0" class="s fillY"/><rect x="154" y="50" width="266" height="40" rx="0" class="s fillA"/>
  <text x="32" y="75" class="lb " text-anchor="middle">s</text><text x="99" y="75" class="lb " text-anchor="middle">exposant</text><text x="287" y="75" class="lb " text-anchor="middle">mantisse</text>
  <text x="32" y="110" class="lb nt" text-anchor="middle">1</text><text x="99" y="110" class="lb nt" text-anchor="middle">11 bits</text><text x="287" y="110" class="lb nt" text-anchor="middle">52 bits</text><text x="220" y="32" class="lb nt" text-anchor="middle">64 bits</text>
  <text x="220" y="140" class="lb " text-anchor="middle"><tspan class="it">x</tspan> = (−1)<tspan baseline-shift="super" font-size="10"><tspan class="it">s</tspan></tspan> × 1,<tspan class="it">m</tspan> × 2<tspan baseline-shift="super" font-size="10"><tspan class="it">e</tspan> − 1023</tspan></text></svg>
