</defs><line x1="190" y1="225" x2="190" y2="40" class="s " marker-end="url(#ah)"/><text x="184" y="46" class="lb " text-anchor="end"><tspan class="it">E</tspan>° (V)</text><line x1="184" y1="79.2" x2="196" y2="79.2" class="s "/><text x="170" y="83.2" class="lb r" text-anchor="end">Cu²⁺</text><text x="210" y="83.2" class="lb b" text-anchor="start">Cu</text><text x="300" y="83.2" class="lb nt" text-anchor="end">0,34</text><line x1="184" y1="120" x2="196" y2="120" class="s "/><text x="170" y="124" class="lb r" text-anchor="end">2 H⁺</text><text x="210" y="124" class="lb b" text-anchor="start">H₂</text><text x="300" y="124" class="lb nt" text-anchor="end">0,00</text><line x1="184" y1="172.8" x2="196" y2="172.8" class="s "/><text x="170" y="176.8" class="lb r" text-anchor="end">Fe²⁺</text><text x="210" y="176.8" class="lb b" text-anchor="start">Fe</text><text x="300" y="176.8" class="lb nt" text-anchor="end">-0,44</text><line x1="184" y1="211.2" x2="196" y2="211.2" class="s "/><text x="170" y="215.2" class="lb r" text-anchor="end">Zn²⁺</text><text x="210" y="215.2" class="lb b" text-anchor="start">Zn</text><text x="300" y="215.2" class="lb nt" text-anchor="end">-0,76</text><text x="120" y="22" class="lb r" text-anchor="middle">oxydants</text><text x="260" y="22" class="lb b" text-anchor="middle">réducteurs</text><line x1="150" y1="87.2" x2="222" y2="201.2" class="s soft" marker-end="url(#ah)"/><text x="190" y="246" class="lb nt" text-anchor="middle">réaction : oxydant le plus fort + réducteur le plus fort</text></svg>
