<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" role="img" aria-label="Arbre de probabilités : formule des probabilités totales P(B) = P(A)P_A(B) + P(Ā)P_Ā(B), puis formule de Bayes P_B(A) = P(A)P_A(B)/P(B)" class="fig-svg"><style>
