<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 256" role="img" aria-label="Niveaux d’énergie de l’atome d’hydrogène, En = −13,6/n² eV : les transitions vers n = 1 forment la série de Lyman (UV), celles vers n = 2 la série de Balmer (visible)" class="fig-svg"><style>
