<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" role="img" aria-label="Après b = a, les deux noms désignent la même liste : modifier b[0] modifie aussi a. Avec c = a.copy() (ou a[:]), on obtient une liste indépendante" class="fig-svg"><style>
.s{fill:none;stroke:#2c2c2e;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.thick{stroke-width:2.6}.r{stroke:#c2410c}.b{stroke:#0066cc}.soft{stroke:#6e6e73}
.dash{stroke-dasharray:5 4}.axis{stroke:#6e6e73;stroke-dasharray:8 3 2 3;stroke-width:1.1}.dim{stroke:#6e6e73;stroke-width:1}
.ray{stroke:#a15c00;stroke-width:1.3}.spring{stroke:#2c2c2e;stroke-width:1.5}
.fillA{fill:rgba(0,102,204,.10)}.fillB{fill:rgba(0,102,204,.2)}.fillR{fill:rgba(194,65,12,.15)}.fillW{fill:none}.fillY{fill:rgba(161,92,0,.18)}.fillI{fill:rgba(31,79,184,.2)}.fillG{fill:rgba(110,110,115,.22)}.fill{fill:#2c2c2e}
.hatch{fill:url(#hatch);stroke:none}.ht{stroke:#6e6e73;stroke-width:1.2}
.fh{fill:#2c2c2e}.fh.r{fill:#c2410c}.fh.b{fill:#0066cc}.pt{fill:#2c2c2e}.pt.r{fill:#c2410c}
text{stroke:none}.lb{font:14px Georgia,'Times New Roman',serif;fill:#2c2c2e}.lb.r{fill:#c2410c}.lb.b{fill:#0066cc}
.lb.nt{fill:#6e6e73;font:500 12.5px -apple-system,'Segoe UI',Roboto,Arial,sans-serif}.it{font-style:italic}.vec{font-size:11px;font-style:normal}
</style><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1L10,5L0,9z" class="fh"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1L10,5L0,9z" class="fh r"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1L10,5L0,9z" class="fh b"/></marker>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="ht"/></pattern>
</defs>
  <text x="40" y="46" class="lb " text-anchor="end">a</text><text x="40" y="96" class="lb " text-anchor="end">b</text><text x="40" y="166" class="lb " text-anchor="end">c</text>
  <line x1="48" y1="42" x2="150" y2="62" class="s b" marker-end="url(#ahb)"/><line x1="48" y1="92" x2="150" y2="76" class="s " marker-end="url(#ah)"/><line x1="48" y1="162" x2="150" y2="162" class="s " marker-end="url(#ah)"/>
  <rect x="152" y="54" width="34" height="30" rx="0" class="s fillW"/><text x="169" y="74" class="lb " text-anchor="middle">9</text><rect x="186" y="54" width="34" height="30" rx="0" class="s fillW"/><text x="203" y="74" class="lb " text-anchor="middle">2</text><rect x="220" y="54" width="34" height="30" rx="0" class="s fillW"/><text x="237" y="74" class="lb " text-anchor="middle">3</text><text x="290" y="74" class="lb r" text-anchor="start">← b[0] = 9 modifie aussi a</text>
  <rect x="152" y="147" width="34" height="30" rx="0" class="s fillW"/><text x="169" y="167" class="lb " text-anchor="middle">1</text><rect x="186" y="147" width="34" height="30" rx="0" class="s fillW"/><text x="203" y="167" class="lb " text-anchor="middle">2</text><rect x="220" y="147" width="34" height="30" rx="0" class="s fillW"/><text x="237" y="167" class="lb " text-anchor="middle">3</text><text x="290" y="167" class="lb nt" text-anchor="start">copie indépendante</text>
  <text x="152" y="38" class="lb nt" text-anchor="start">une seule liste en mémoire</text></svg>
