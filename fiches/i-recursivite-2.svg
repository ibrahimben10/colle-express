  <text x="220" y="50" class="lb " text-anchor="start">fact(0) = 1</text><text x="220" y="86" class="lb " text-anchor="start">fact(1) = 1 × 1 = 1</text><text x="220" y="122" class="lb " text-anchor="start">fact(2) = 2 × 1 = 2</text><text x="220" y="158" class="lb b" text-anchor="start">fact(3) = 3 × 2 = 6</text>
