  <rect x="40" y="150" width="120" height="32" rx="0" class="s fillW"/><text x="100" y="171" class="lb " text-anchor="middle">fact(3)</text><rect x="40" y="114" width="120" height="32" rx="0" class="s fillW"/><text x="100" y="135" class="lb " text-anchor="middle">fact(2)</text><rect x="40" y="78" width="120" height="32" rx="0" class="s fillW"/><text x="100" y="99" class="lb " text-anchor="middle">fact(1)</text><rect x="40" y="42" width="120" height="32" rx="0" class="s fillA"/><text x="100" y="63" class="lb " text-anchor="middle">fact(0)</text>
