<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" role="img" aria-label="Pile d’appels de fact(3) : chaque appel attend le résultat du suivant ; le cas de base fact(0) = 1 arrête la récursion, puis les résultats remontent" class="fig-svg"><style>
