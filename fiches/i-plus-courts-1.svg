<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="Algorithme de Dijkstra depuis A (poids positifs) : on traite à chaque étape le sommet non traité de plus petite distance provisoire, puis on met à jour ses voisins ; distances finales en rouge" class="fig-svg"><style>
