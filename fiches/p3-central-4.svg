<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" role="img" aria-label="Satellite géostationnaire : orbite circulaire dans le plan équatorial, période égale au jour sidéral, altitude ≈ 36 000 km" class="fig-svg"><style>
